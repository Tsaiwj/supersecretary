<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>團隊服務系統</title>
    <style>
        :root {
            color-scheme: light;
            --blue: #4b6cb7;
            --blue-light: #829dce;
            --green: #2e7d32;
            --red: #e65c5c;
            --ink: #1f2937;
            --muted: #6b7280;
            --line: #e5e7eb;
            --page: #f3f4f6;
        }

        * { box-sizing: border-box; }
        html { background: var(--page); }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            padding: max(16px, env(safe-area-inset-top)) 12px max(20px, env(safe-area-inset-bottom));
            background: var(--page);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        }

        .shell {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 8px 22px rgba(15, 23, 42, .12);
        }

        .header {
            min-height: 58px;
            display: flex;
            align-items: center;
            padding: 15px 18px;
            background: linear-gradient(90deg, var(--blue), var(--blue-light));
            color: #fff;
        }

        .header h1 { margin: 0; font-size: 20px; line-height: 1.4; }
        .view { min-height: 176px; padding: 20px 18px; }
        .loading { display: grid; place-items: center; gap: 12px; min-height: 136px; color: var(--muted); text-align: center; }
        .spinner { width: 26px; height: 26px; border: 3px solid #dbe3f2; border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .stack { display: grid; gap: 16px; }
        .notice { padding: 14px; border: 1px solid #bfdbfe; border-radius: 10px; background: #eff6ff; }
        .notice.success { border-color: #bbf7d0; background: #f0fdf4; color: #166534; }
        .notice.error { border-color: #fecaca; background: #fef2f2; color: #991b1b; }
        .notice-title { margin-bottom: 5px; font-size: 18px; font-weight: 700; }
        .muted { color: var(--muted); font-size: 14px; line-height: 1.65; }

        label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 600; }
        input {
            width: 100%;
            min-height: 48px;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-size: 16px;
            outline: none;
        }
        input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(75, 108, 183, .15); }

        button {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 9px;
            padding: 11px 14px;
            background: var(--blue);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button.share { background: var(--red); }
        button:disabled { opacity: .62; cursor: wait; }
        .status { min-height: 20px; color: #b91c1c; font-size: 14px; line-height: 1.5; }
        .status.neutral { color: var(--muted); text-align: center; }
    </style>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
</head>
<body>
    <main class="shell">
        <header class="header">
            <h1 id="page-title">團隊服務系統</h1>
        </header>
        <section id="app-view" class="view" aria-live="polite" aria-busy="true">
            <div class="loading">
                <div class="spinner" aria-hidden="true"></div>
                <div>正在連結 LINE 並驗證身分…</div>
            </div>
        </section>
    </main>

    <script>
        const APP_CONFIG = {
            liffId: '2010415210-bfQ2MB3J',
            apiUrl: 'https://script.google.com/macros/s/AKfycbwhFC-vHbVdPBtW8s_cwj0_dDnzpzeBEZ4suM-lGpAewBHIRdZd0_N6BX7poAg0ueLplA/exec'
        };

        let liffIdToken = '';
        let preparedShareMessages = [];

        document.addEventListener('DOMContentLoaded', initLiffApp);

        async function initLiffApp() {
            if (!isApiConfigured()) {
                renderError('尚未設定 Apps Script Web App URL。');
                return;
            }
            if (!APP_CONFIG.liffId || APP_CONFIG.liffId.indexOf('PASTE_') === 0) {
                renderError('尚未設定 LIFF ID。');
                return;
            }
            if (typeof liff === 'undefined') {
                renderError('LINE LIFF SDK 載入失敗，請重新開啟頁面。');
                return;
            }

            try {
                await liff.init({ liffId: APP_CONFIG.liffId });

                if (!liff.isLoggedIn()) {
                    liff.login({ redirectUri: location.href });
                    return;
                }

                liffIdToken = liff.getIDToken();
                if (!liffIdToken) {
                    throw new Error('無法取得 LINE ID Token，請確認 LIFF 已啟用 openid scope。');
                }

                // LIFF 會在 init() 完成後還原附加的 page/memberKey 參數，因此此時才讀取網址。
                const page = requestedParam('page') || 'verify';
                if (page === 'verify') {
                    await renderTeamVerification();
                    return;
                }
                if (page === 'shareCard') {
                    await renderDigitalCardShare();
                    return;
                }
                if (page === 'shareSurveyTemplate') {
                    await renderSurveyTemplateShare();
                    return;
                }
                throw new Error('不支援的 LIFF 頁面。');
            } catch (error) {
                renderError(errorText(error));
            }
        }

        function requestedParam(name) {
            const params = new URLSearchParams(location.search);
            const directValue = params.get(name);
            if (directValue) return directValue;

            const liffState = params.get('liff.state');
            if (!liffState) return '';
            const questionIndex = liffState.indexOf('?');
            const query = questionIndex >= 0
                ? liffState.substring(questionIndex + 1)
                : liffState.replace(/^\/?/, '');
            return new URLSearchParams(query).get(name) || '';
        }

        async function renderTeamVerification() {
            setTitle('團隊成員驗證');
            setLoading('正在檢查綁定狀態…');

            const result = await secureApi('getMemberState', { idToken: liffIdToken });
            if (result.bound) {
                setView(`
                    <div class="stack">
                        <div class="notice success">
                            <div class="notice-title">${escapeHtml(result.member.name)}</div>
                            <div>${escapeHtml(result.member.title || '團隊成員')}</div>
                            <div class="muted" style="margin-top:8px;color:#166534">已完成 LINE 身分綁定。</div>
                        </div>
                        <button type="button" onclick="closeLiffWindow()">完成</button>
                    </div>
                `);
                return;
            }

            setView(`
                <div class="stack">
                    <div class="muted">請輸入「團隊成員」工作表中登記的手機完整號碼，完成 LINE 身分綁定。</div>
                    <div>
                        <label for="verify-phone">手機完整號碼</label>
                        <input id="verify-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="例如：0912345678">
                    </div>
                    <div id="verify-status" class="status"></div>
                    <button id="verify-button" type="button" onclick="submitTeamBinding()">完成驗證</button>
                </div>
            `);
        }

        async function submitTeamBinding() {
            const phoneInput = document.getElementById('verify-phone');
            const button = document.getElementById('verify-button');
            const status = document.getElementById('verify-status');
            const phone = phoneInput.value.trim();
            if (!phone) {
                status.textContent = '請輸入手機號碼。';
                phoneInput.focus();
                return;
            }

            button.disabled = true;
            button.textContent = '驗證中…';
            status.textContent = '';
            try {
                await secureApi('bindMember', { idToken: liffIdToken, phone });
                await renderTeamVerification();
            } catch (error) {
                status.textContent = errorText(error);
                button.disabled = false;
                button.textContent = '完成驗證';
            }
        }

        async function renderDigitalCardShare() {
            setTitle('數位名片轉分享');
            const memberKey = requestedParam('memberKey');
            if (!memberKey) {
                renderError('缺少團隊成員名片識別資訊。');
                return;
            }

            setLoading('正在準備數位名片…');
            const result = await secureApi('getDigitalCardShareMessages', {
                idToken: liffIdToken,
                memberKey
            });

            preparedShareMessages = result.messages || [];
            setView(`
                <div class="stack">
                    <div class="notice">
                        <div class="notice-title">${escapeHtml(result.memberName || '團隊成員')}</div>
                        <div class="muted">點擊下方按鈕，選擇要分享名片的 LINE 好友或群組。</div>
                    </div>
                    <button id="share-card-button" type="button" class="share" onclick="sharePreparedMessages()">選擇分享對象</button>
                    <div id="share-status" class="status neutral"></div>
                </div>
            `);
        }

        async function renderSurveyTemplateShare() {
            setTitle('問卷模版轉分享');
            setLoading('正在準備問卷模版…');

            const result = await secureApi('getSurveyTemplateShareMessages', {
                idToken: liffIdToken
            });

            preparedShareMessages = result.messages || [];
            setView(`
                <div class="stack">
                    <div class="notice">
                        <div class="notice-title">${escapeHtml(result.templateTitle || '填寫問卷模版')}</div>
                        <div class="muted">點擊下方按鈕，將完整問卷卡片分享給 LINE 好友或群組；收到卡片的人也可以再次轉分享。</div>
                    </div>
                    <button id="share-card-button" type="button" class="share" onclick="sharePreparedMessages()">選擇分享對象</button>
                    <div id="share-status" class="status neutral"></div>
                </div>
            `);
        }

        async function sharePreparedMessages() {
            const button = document.getElementById('share-card-button');
            const status = document.getElementById('share-status');
            if (!preparedShareMessages.length) {
                status.textContent = '目前沒有可分享的內容。';
                return;
            }

            try {
                if (!liff.isApiAvailable('shareTargetPicker')) {
                    throw new Error('此環境無法使用分享選擇器，請用 LINE 開啟此頁並確認 LIFF 已啟用分享功能。');
                }
                button.disabled = true;
                button.textContent = '正在開啟分享選擇器…';
                const result = await liff.shareTargetPicker(preparedShareMessages, { isMultiple: true });
                status.textContent = result && result.status === 'success' ? '內容已送出。' : '尚未送出分享。';
            } catch (error) {
                status.textContent = errorText(error);
            } finally {
                button.disabled = false;
                button.textContent = '選擇分享對象';
            }
        }

        async function secureApi(action, payload) {
            const response = await fetch(APP_CONFIG.apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ requestType: 'liff-api', action, payload: payload || {} })
            });
            const responseText = await response.text();
            let result;
            try {
                result = JSON.parse(responseText);
            } catch (error) {
                throw new Error('LIFF API 回應格式錯誤。');
            }
            if (!result || !result.ok) {
                throw new Error(result && result.message ? result.message : 'LIFF API 執行失敗。');
            }
            return result;
        }

        function setTitle(text) {
            document.getElementById('page-title').textContent = text;
            document.title = text;
        }

        function setLoading(text) {
            setView(`<div class="loading"><div class="spinner" aria-hidden="true"></div><div>${escapeHtml(text)}</div></div>`, true);
        }

        function setView(html, busy) {
            const view = document.getElementById('app-view');
            view.innerHTML = html;
            view.setAttribute('aria-busy', busy ? 'true' : 'false');
        }

        function renderError(message) {
            setView(`<div class="notice error">${escapeHtml(message || '發生錯誤。')}</div>`);
        }

        function closeLiffWindow() {
            if (typeof liff !== 'undefined' && liff.isInClient()) {
                liff.closeWindow();
                return;
            }
            window.close();
        }

        function isApiConfigured() {
            return APP_CONFIG.apiUrl && APP_CONFIG.apiUrl.indexOf('PASTE_') !== 0;
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function errorText(error) {
            return error && error.message ? error.message : String(error || '發生錯誤。');
        }
    </script>
</body>
</html>
